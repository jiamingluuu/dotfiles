<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>{{DOCUMENT_TITLE}}</title>
    <style>
      :root {
        color-scheme: light;
        --color-bg-1: #ffffff;
        --color-bg-2: #f7f8fa;
        --color-bg-3: #f2f3f5;
        --color-fill-1: #f7f8fa;
        --color-fill-2: #f2f3f5;
        --color-border-1: #f2f3f5;
        --color-border-2: #e5e6eb;
        --color-border-3: #c9cdd4;
        --color-text-1: #1d2129;
        --color-text-2: #4e5969;
        --color-text-3: #86909c;
        --color-primary: #165dff;
        --color-primary-hover: #4080ff;
        --color-primary-light: #e8f3ff;
        --color-success: #00b42a;
        --color-success-light: #e8ffea;
        --color-warning: #ff7d00;
        --color-warning-light: #fff7e8;
        --color-danger: #f53f3f;
        --color-danger-light: #ffece8;
        --radius-small: 2px;
        --radius-medium: 4px;
        --radius-large: 8px;
        --content-width: 1200px;
        --shadow-card: 0 2px 8px rgba(29, 33, 41, 0.08);
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        --font-sans: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--color-bg-3);
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          radial-gradient(circle at 8% 0%, rgba(22, 93, 255, 0.08), transparent 28rem),
          linear-gradient(180deg, #f7f8fa 0, var(--color-bg-3) 32rem);
        color: var(--color-text-1);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.65;
        text-rendering: optimizeLegibility;
      }

      a {
        color: var(--color-primary);
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      a:hover {
        color: var(--color-primary-hover);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      a:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 2px;
      }

      code {
        border-radius: var(--radius-small);
        background: var(--color-fill-2);
        padding: 1px 4px;
        color: #0e42d2;
        font-family: var(--font-mono);
        font-size: 0.9em;
        overflow-wrap: anywhere;
      }

      .report-shell {
        width: min(calc(100% - 48px), var(--content-width));
        margin: 0 auto;
        padding: 32px 0 64px;
      }

      .report-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-large);
        background: var(--color-bg-1);
        padding: 24px;
        box-shadow: var(--shadow-card);
      }

      .report-header-main {
        min-width: 0;
      }

      .report-link {
        flex: 0 0 auto;
        color: var(--color-primary);
        font-size: 14px;
        font-weight: 500;
        line-height: 22px;
        white-space: nowrap;
      }

      h1 {
        max-width: 960px;
        margin: 0;
        font-size: 28px;
        font-weight: 600;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .report-section {
        margin-top: 32px;
      }

      .section-heading {
        margin: 0 0 16px;
        font-size: 22px;
        font-weight: 600;
        line-height: 32px;
      }

      .status-panel {
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-medium);
        background: var(--color-success-light);
        padding: 16px 20px;
      }

      .status-panel[data-tone="danger"] {
        background: var(--color-danger-light);
      }

      .status-panel[data-tone="warning"] {
        background: var(--color-warning-light);
      }

      .status-copy {
        margin: 0;
        color: var(--color-success);
        font-size: 18px;
        font-weight: 600;
        line-height: 28px;
      }

      .status-panel[data-tone="danger"] .status-copy {
        color: var(--color-danger);
      }

      .status-panel[data-tone="warning"] .status-copy {
        color: var(--color-warning);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 6px;
        margin: 0;
      }

      .report-metrics {
        position: relative;
        z-index: 2;
        margin-top: 24px;
      }

      .metric {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column-reverse;
        min-width: 0;
        min-height: 76px;
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-medium);
        background: var(--color-bg-1);
        padding: 12px 8px;
        text-align: center;
      }

      .metric dt {
        color: var(--color-text-3);
        font-size: 12px;
        line-height: 18px;
      }

      .metric dd {
        margin: 0 0 2px;
        color: var(--color-text-1);
        font-family: var(--font-mono);
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        line-height: 28px;
        overflow-wrap: anywhere;
      }

      .metric[data-tone="success"] dd {
        color: var(--color-success);
      }

      .metric[data-tone="warning"] dd {
        color: var(--color-warning);
      }

      .metric[data-tone="danger"] dd {
        color: var(--color-danger);
      }

      .metric[data-tone="muted"] dd {
        color: var(--color-text-3);
      }

      .metric[data-tone="info"] dd {
        color: var(--color-primary);
      }

      .metric--coverage {
        position: relative;
        cursor: help;
        outline: none;
      }

      .metric--coverage:focus-visible {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 2px var(--color-primary-light);
      }

      .coverage-popover {
        position: absolute;
        z-index: 20;
        top: calc(100% + 8px);
        right: 0;
        display: none;
        width: min(820px, calc(100vw - 48px));
        max-height: min(560px, calc(100vh - 160px));
        overflow: auto;
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-large);
        background: var(--color-bg-1);
        padding: 20px;
        box-shadow: 0 12px 36px rgba(29, 33, 41, 0.2);
        color: var(--color-text-1);
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 400;
        line-height: 22px;
        text-align: left;
      }

      .metric--coverage:hover .coverage-popover,
      .metric--coverage:focus .coverage-popover,
      .metric--coverage:focus-within .coverage-popover {
        display: block;
      }

      .coverage-summary {
        margin: 0 0 12px;
        font-weight: 500;
      }

      .coverage-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .coverage-table th,
      .coverage-table td {
        border: 1px solid var(--color-border-2);
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
      }

      .coverage-table th {
        background: var(--color-bg-2);
        color: var(--color-text-2);
        font-weight: 500;
      }

      .coverage-table td:nth-child(n + 2) {
        text-align: center;
      }

      .coverage-state {
        font-weight: 500;
      }

      .coverage-state[data-covered="true"] {
        color: var(--color-success);
      }

      .coverage-state[data-covered="false"] {
        color: var(--color-danger);
      }

      .coverage-state[data-covered="unknown"] {
        color: var(--color-warning);
      }

      .finding-list {
        display: grid;
        gap: 16px;
      }

      .finding {
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-large);
        background: var(--color-bg-1);
        box-shadow: var(--shadow-card);
      }

      .finding-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--color-border-2);
        background: var(--color-bg-2);
        padding: 16px 20px;
      }

      .finding-header h3 {
        min-width: 0;
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        line-height: 28px;
        overflow-wrap: anywhere;
      }

      .badges {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px;
      }

      .badge {
        border: 1px solid #bedaff;
        border-radius: var(--radius-small);
        background: var(--color-primary-light);
        padding: 1px 8px;
        color: #0e42d2;
        font-size: 12px;
        line-height: 20px;
      }

      .badge--reason[data-reason="业务缺陷"] {
        border-color: #ffb3ad;
        background: var(--color-danger-light);
        color: var(--color-danger);
      }

      .badge--reason[data-reason="预期变更"] {
        border-color: #bedaff;
        background: var(--color-primary-light);
        color: #0e42d2;
      }

      .badge--reason[data-reason="噪音"] {
        border-color: var(--color-border-3);
        background: var(--color-fill-2);
        color: var(--color-text-2);
      }

      .badge--reason[data-reason="FTF平台问题"] {
        border-color: #ffcf8b;
        background: var(--color-warning-light);
        color: var(--color-warning);
      }

      .finding-details {
        display: grid;
        grid-template-columns: 120px minmax(0, 1fr);
        margin: 0;
      }

      .finding-details dt,
      .finding-details dd {
        min-width: 0;
        margin: 0;
        border-bottom: 1px solid var(--color-border-2);
        padding: 16px 20px;
      }

      .finding-details dt {
        background: var(--color-bg-1);
        color: var(--color-text-2);
        font-weight: 500;
      }

      .finding-details dd {
        border-left: 1px solid var(--color-border-2);
        overflow-wrap: anywhere;
      }

      .finding-details dt:last-of-type,
      .finding-details dd:last-of-type {
        border-bottom: 0;
      }

      .finding-details p,
      .evidence-narrative p {
        margin: 0;
      }

      .evidence-narrative {
        display: grid;
        gap: 12px;
      }

      .sample-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .sample-links a {
        border-radius: var(--radius-small);
        background: var(--color-primary-light);
        padding: 2px 8px;
        line-height: 22px;
      }

      .conclusion-defects {
        margin-top: 16px;
      }

      .code-excerpt {
        width: 100%;
        max-width: 100%;
        margin: 12px 0 0;
        overflow: auto;
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-medium);
        background: var(--color-fill-2);
        padding: 12px 16px;
        white-space: pre;
      }

      .code-excerpt code {
        background: transparent;
        padding: 0;
        color: var(--color-text-1);
        white-space: inherit;
      }

      .action-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: action;
      }

      .action-list li {
        position: relative;
        border: 1px solid var(--color-border-2);
        border-radius: var(--radius-medium);
        background: var(--color-bg-1);
        padding: 16px 20px 16px 52px;
        overflow-wrap: anywhere;
        counter-increment: action;
      }

      .action-list li::before {
        position: absolute;
        top: 16px;
        left: 16px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--color-primary);
        color: #ffffff;
        content: counter(action);
        font: 600 12px/24px var(--font-sans);
        text-align: center;
      }

      .empty-state {
        margin: 0;
        border: 1px dashed var(--color-border-3);
        border-radius: var(--radius-medium);
        background: var(--color-bg-2);
        padding: 16px;
        color: var(--color-text-3);
        text-align: center;
      }

      .report-footer {
        margin-top: 40px;
        border-top: 1px solid var(--color-border-2);
        padding-top: 16px;
        color: var(--color-text-3);
        font-family: var(--font-mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      @media (max-width: 760px) {
        .metric-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .metric {
          min-height: 68px;
          padding: 10px 6px;
        }

        .metric dt {
          font-size: 11px;
          line-height: 16px;
        }

        .metric dd {
          font-size: 20px;
          line-height: 26px;
        }

        .coverage-popover {
          right: auto;
          left: 0;
        }
      }

      @media (max-width: 720px) {
        .report-shell {
          width: min(calc(100% - 24px), var(--content-width));
          padding-top: 16px;
        }

        .finding-header {
          align-items: stretch;
          flex-direction: column;
        }

        h1 {
          font-size: 24px;
        }

        .report-header {
          align-items: flex-start;
          gap: 12px;
        }

        .section-heading {
          font-size: 20px;
        }

        .finding-details {
          grid-template-columns: 1fr;
        }

        .finding-details dt {
          border-bottom: 0;
          padding-bottom: 4px;
        }

        .finding-details dd {
          border-left: 0;
          padding-top: 4px;
        }

        .badges {
          justify-content: flex-start;
        }
      }

      @media (max-width: 420px) {
        .metric-grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 4px;
        }

        .metric {
          min-height: 62px;
          padding: 8px 2px;
        }

        .metric dt {
          font-size: 10px;
          line-height: 14px;
        }

        .metric dd {
          font-size: 18px;
          line-height: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
      }

      @media print {
        :root {
          --color-bg-1: #ffffff;
          --color-bg-2: #ffffff;
          --color-bg-3: #ffffff;
          --color-fill-2: #f2f3f5;
          --shadow-card: none;
        }

        body {
          background: #ffffff;
          font-size: 10.5pt;
        }

        .report-shell {
          width: 100%;
          padding: 0;
        }

        .report-header {
          box-shadow: none;
        }

        .report-section {
          margin-top: 24px;
        }

        .metric,
        .status-panel {
          break-inside: avoid;
        }

        .coverage-popover {
          display: none !important;
        }

        .finding {
          break-inside: auto;
          box-shadow: none;
        }

        .finding-header,
        .finding-details dt,
        .finding-details dd,
        .section-heading {
          break-inside: avoid;
        }

        .code-excerpt {
          white-space: pre-wrap;
        }

        a {
          color: #0e42d2;
        }
      }
    </style>
  </head>
  <body>
    <div class="report-shell">
      {{REPORT_BODY}}
      <footer class="report-footer">任务 {{TASK_ID}} · 快照 {{SNAPSHOT_TIME}}</footer>
    </div>
  </body>
</html>
